<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fleet | Uppidi</title>
    <style>
      :root {
        --bg: #0b1020;
        --panel: #121a2b;
        --accent: #6ee7b7;
        --text: #e5eefb;
        --muted: #a7b5d0;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #18243d 0%, var(--bg) 60%);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }

      .card {
        width: min(90vw, 560px);
        padding: 3rem 2rem;
        background: rgba(18, 26, 43, 0.9);
        border: 1px solid rgba(110, 231, 183, 0.25);
        border-radius: 18px;
        text-align: center;
        box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
      }

      .eyebrow {
        margin: 0 0 1rem;
        text-transform: uppercase;
        letter-spacing: 0.18em;
        color: var(--accent);
        font-size: 0.72rem;
        font-weight: 700;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.2rem, 5vw, 3.3rem);
      }

      p {
        margin: 1rem auto 0;
        max-width: 40ch;
        color: var(--muted);
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="eyebrow">Uppidi Fleet</div>
      <h1>Coming Soon</h1>
      <p>This fleet subdomain is currently being prepared. Please check back shortly.</p>
    </main>
  </body>
</html>
